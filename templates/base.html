<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block tytul %}Accountant{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="naglowek">
    <div class="nawigacja">
        <a class="logo" href="{{ url_for('glowna') }}">accountant<span>Magazyn i księgowość</span></a>
        <nav aria-label="Nawigacja główna">
            <a href="{{ url_for('glowna') }}" {% if request.endpoint == 'glowna' %}aria-current="page"{% endif %}>Strona główna</a>
            <a href="{{ url_for('historia') }}" {% if request.endpoint == 'historia' %}aria-current="page"{% endif %}>Historia</a>
        </nav>
    </div>
</header>
<main>
{% block tresc %}{% endblock %}
</main>
<footer>Accountant · Ewidencja firmy</footer>
</body>
</html>
